apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-app
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: front
      app.kubernetes.io/instance: front-app
      app.kubernetes.io/version: '1.14.2'
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: front-app
      app.kubernetes.io/managed-by: Helm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: front
        app.kubernetes.io/instance: front-app
        app.kubernetes.io/version: '1.14.2'
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: front-app
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
        - name: front-container
          image: '{{ .Values.acrName }}.azurecr.io/front:{{ .Values.imageTag }}'
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: '100m'
              memory: '64Mi'
            limits:
              cpu: '200m'
              memory: '128Mi'
