server {
    # 8080, not 80 -- the Deployment runs this container as a non-root user
    # (runAsUser: 101, deployment.yaml), which can't bind a port below 1024.
    # The k8s Service still exposes port 80 externally (service.yaml),
    # forwarding to this container port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; frame-src 'none';" always;

    # SPA fallback: any path Angular's router owns (not a real file on disk)
    # must still serve index.html, or a hard refresh on e.g. /quiz/123 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actuator-equivalent for this image -- AKS's readiness/liveness probes
    # (helm/templates/deployment.yaml) hit this instead of parsing the SPA.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://back-service:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
}
}
