version: 2
updates:
  # --- Dépendances npm (Angular / package.json) ---
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'

  # --- GitHub Actions (workflows CI/CD) ---
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
