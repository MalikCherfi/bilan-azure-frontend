name: Dependency Review

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        runs-on: [self-hosted, azure, front]
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Dependency Review
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: "high"
                  comment-summary-in-pr: "always"
