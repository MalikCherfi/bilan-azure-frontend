name: Build and deploy

on:
    push:
        branches: [$default-branch]
    workflow_dispatch:

env:
    CONTAINER_NAME: "front"
    RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
    CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
    KUSTOMIZE_PATH: "k8s/base"

jobs:
    buildImage:
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        outputs:
            acr_name: ${{ steps.get-acr.outputs.acr_name }}
        steps:
            # Checks out the repository this file is in
            - uses: actions/checkout@v7

            # Logs in with your Azure credentials
            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Retrieve ACR name from ACR tags
              id: get-acr
              run: |
                  ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} \
                  --query "[?tags.owner=='malik-cherfi'].name" -o tsv)
                  echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"

            - name: Build and push image to ACR
              run: |
                  az acr build \
                  --image ${{ steps.get-acr.outputs.acr_name }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
                  --registry ${{ steps.get-acr.outputs.acr_name }} \
                  -g ${{ env.RESOURCE_GROUP }} .

    deploy:
        permissions:
            actions: read
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [buildImage]
        steps:
            # Checks out the repository this file is in
            - uses: actions/checkout@v7

            # Logs in with your Azure credentials
            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # Use kubelogin to configure your kubeconfig for Azure auth
            - name: Set up kubelogin for non-interactive login
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: "v0.2.19"

            # Retrieves your Azure Kubernetes Service cluster's kubeconfig file
            - name: Get K8s context
              uses: azure/aks-set-context@v3
              with:
                  resource-group: ${{ env.RESOURCE_GROUP }}
                  cluster-name: ${{ env.CLUSTER_NAME }}
                  admin: "false"
                  use-kubelogin: "true"

            # Runs Kustomize to create manifest files
            - name: Bake deployment
              uses: azure/k8s-bake@v2
              with:
                  renderEngine: "kustomize"
                  kustomizationPath: ${{ env.KUSTOMIZE_PATH }}
                  kubectl-version: latest
              id: bake

            # Deploys application based on manifest files from previous step
            - name: Deploy application
              uses: Azure/k8s-deploy@v4
              with:
                  action: deploy
                  manifests: ${{ steps.bake.outputs.manifestsBundle }}
                  images: |
                      ${{ needs.buildImage.outputs.acr_name }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}
