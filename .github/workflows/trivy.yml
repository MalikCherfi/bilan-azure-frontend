name: Trivy Container & Dockerfile Security Scan

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read
    security-events: write

jobs:
    trivy-scan:
        name: Trivy Security Scan Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Build Docker Image
              run: |
                  docker build \
                    --build-arg API_BASE_URL="https://api.example.com" \
                    --build-arg API_KEY="dummy-key-for-trivy-scan" \
                    -t frontend-app:scan .

            - name: Scan Docker Image for Vulnerabilities (Table Format)
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "frontend-app:scan"
                  format: "table"
                  vuln-type: "os,library"
                  output: "trivy-docker-results.sarif"
                  severity: "CRITICAL,HIGH"
                  exit-code: "1"
                  ignore-unfixed: true

            - name: Scan Docker Image for Vulnerabilities (SARIF Format)
              if: always()
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "frontend-app:scan"
                  format: "sarif"
                  vuln-type: "os,library"
                  output: "trivy-docker-results.sarif"
                  severity: "CRITICAL,HIGH"
                  exit-code: "1"
                  ignore-unfixed: true

            - name: Scan Dockerfile Misconfigurations (Table Format)
              if: always()
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  format: "table"
                  output: "trivy-dockerfile-results.sarif"
                  exit-code: "0"
                  severity: "CRITICAL,HIGH"

            - name: Scan Dockerfile Misconfigurations (SARIF Format)
              if: always()
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  format: "sarif"
                  output: "trivy-dockerfile-results.sarif"
                  exit-code: "0"
                  severity: "CRITICAL,HIGH"

            - name: Upload Docker Image Trivy scan results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-docker-results.sarif"
                  category: "trivy-docker"

            - name: Upload Dockerfile Trivy scan results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-dockerfile-results.sarif"
                  category: "trivy-dockerfile"

            - name: Upload Trivy results as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-docker-artifacts
                  path: |
                      trivy-docker-results.sarif
                      trivy-dockerfile-results.sarif
                  retention-days: 5

    chart-test:
        name: Trivy Security Scan Helm Chart
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.6.3

            - name: Set up python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Scan Helm Chart for Misconfigurations (Table Format)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  hide-progress: false
                  format: "table"
                  scan-ref: "helm"
                  output: "trivy-helm-results.sarif"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Scan Helm Chart for Misconfigurations (SARIF Format)
              if: always()
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  hide-progress: false
                  format: "sarif"
                  scan-ref: "helm"
                  output: "trivy-helm-results.sarif"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

            - name: Upload Trivy scan results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-helm-results.sarif"
                  category: "trivy-helm"

            - name: Upload Trivy results as artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-helm-artifacts
                  path: trivy-helm-results.sarif
                  retention-days: 5

    job-summary:
        name: Trivy Combined Job Summary
        needs: [trivy-scan, chart-test]
        if: always()
        runs-on: ubuntu-latest

        steps:
            - name: Download Docker/Dockerfile artifacts
              uses: actions/download-artifact@v4
              with:
                  name: trivy-docker-artifacts
                  path: docker-results
              continue-on-error: true

            - name: Download Helm artifacts
              uses: actions/download-artifact@v4
              with:
                  name: trivy-helm-artifacts
                  path: helm-results
              continue-on-error: true

            - name: Generate Combined Job Summary
              run: |
                  echo "## 🛡️ Résultat du Scan de Sécurité Trivy" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Cible | Fichier Rapport | Statut SARIF |" >> $GITHUB_STEP_SUMMARY
                  echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY

                  if [ -f docker-results/trivy-docker-results.sarif ]; then
                      echo "| 🐳 **Image Docker** (\`frontend-app:scan\`) | \`trivy-docker-results.sarif\` | ✅ Uploadé |" >> $GITHUB_STEP_SUMMARY
                  else
                      echo "| 🐳 **Image Docker** | - | ❌ Échec |" >> $GITHUB_STEP_SUMMARY
                  fi

                  if [ -f docker-results/trivy-dockerfile-results.sarif ]; then
                      echo "| 📄 **Dockerfile** | \`trivy-dockerfile-results.sarif\` | ✅ Uploadé |" >> $GITHUB_STEP_SUMMARY
                  else
                      echo "| 📄 **Dockerfile** | - | ❌ Échec |" >> $GITHUB_STEP_SUMMARY
                  fi

                  if [ -f helm-results/trivy-helm-results.sarif ]; then
                      echo "| ☸️ **Helm Chart** (\`./helm\`) | \`trivy-helm-results.sarif\` | ✅ Uploadé |" >> $GITHUB_STEP_SUMMARY
                  else
                      echo "| ☸️ **Helm Chart** | - | ❌ Échec |" >> $GITHUB_STEP_SUMMARY
                  fi

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "📊 **Consultez l'onglet [Security > Code scanning](../../security/code-scanning) pour le détail des vulnérabilités.**" >> $GITHUB_STEP_SUMMARY
